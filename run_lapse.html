<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAYROOM - Lapse Exploit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Black+Ops+One&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
  :root { --z-red: #e60000; --z-white: #ffffff; --dark-bg: rgba(12, 12, 15, 0.95); }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh; background: #050505; color: #fff;
    font-family: 'Cairo', sans-serif; display: flex; align-items: center; justify-content: center; direction: rtl; overflow: hidden;
  }
  body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(230, 0, 0, 0.1) 0%, rgba(5,5,5,1) 100%); z-index: 0; }

  .hud-container {
    position: relative; z-index: 1; width: 95%; max-width: 850px; background: var(--dark-bg);
    border: 2px solid #333; border-top: 5px solid var(--z-white); border-bottom: 5px solid var(--z-red);
    border-radius: 12px; padding: 40px 30px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(230, 0, 0, 0.05);
  }

  .brand-title { font-family: 'Black Ops One', 'Orbitron', cursive; font-size: 4rem; text-align: center; color: var(--z-white); letter-spacing: 6px; margin-bottom: 0px; text-transform: uppercase; direction: ltr; text-shadow: 3px 3px 0px #000, -2px -2px 0px var(--z-red); }
  .brand-ar { font-size: 1.5rem; text-align: center; color: var(--z-red); font-weight: 900; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 15px rgba(230, 0, 0, 0.6); }
  
  /* تم إزالة 11.00 */
  .brand-sub { font-size: 1.2rem; text-align: center; color: #ddd; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 25px; direction: ltr; }

  .status-panel { background: rgba(0, 0, 0, 0.8); padding: 20px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); margin-bottom: 15px; position: relative; box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9); }
  .status-panel::before { content: 'EXECUTION'; position: absolute; top: -12px; right: 20px; background: var(--z-white); color: #000; padding: 2px 12px; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; border-radius: 3px; box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }

  #state { font-size: 24px; font-weight: 900; color: var(--z-white); text-shadow: 0 0 10px rgba(255, 255, 255, 0.4); text-align: center; margin-bottom: 10px; }
  
  .loader-wrapper { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .dot { width: 12px; height: 12px; background: var(--z-white); border-radius: 50%; box-shadow: 0 0 10px var(--z-white); animation: bounce 1s infinite alternate; }
  .dot:nth-child(2) { animation-delay: 0.2s; background: var(--z-red); box-shadow: 0 0 10px var(--z-red); } .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { to { transform: translateY(-10px); opacity: 0.5; } }

  #out { white-space: pre-wrap; font: 12px/1.45 Consolas, monospace; background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(230, 0, 0, 0.3); border-radius: 8px; padding: 14px; min-height: 150px; max-height: 250px; overflow-y: auto; color: #ccc; direction: ltr; text-align: left; }
  #out::-webkit-scrollbar { width: 5px; } #out::-webkit-scrollbar-thumb { background: var(--z-red); border-radius: 5px; }

  .powered-by { position: fixed; bottom: 12px; right: 20px; font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.3); z-index: 10; direction: ltr; }
  .powered-by span { color: var(--z-red); font-weight: 900; text-shadow: 0 0 5px var(--z-red); }
  .footer-sys { position: fixed; bottom: 12px; left: 20px; font-family: 'Orbitron', sans-serif; font-size: 11px; color: rgba(255,255,255,0.2); letter-spacing: 2px; z-index: 10; direction: ltr; }

  @media (max-width: 600px) { .brand-title { font-size: 2.8rem; } .brand-ar { font-size: 1.2rem; } .hud-container { padding: 30px 15px; } .powered-by { font-size: 10px; right: 10px; } .footer-sys { font-size: 9px; left: 10px; } }
</style>
</head>
<body>

<div class="hud-container">
  <h1 class="brand-title">PLAYROOM</h1>
  <div class="brand-ar">الزملكوي</div>
  <div class="brand-sub">LAPSE EXPLOIT</div>

  <div class="status-panel">
    <div id="state">
      <span id="stateText">⏳ جارٍ تحميل سلسلة Lapse...</span>
      <div class="loader-wrapper">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>
  </div>
  
  <div id="out"></div>
</div>

<div class="powered-by">POWERED BY <span>MAHMOUD FATHY</span></div>
<div class="footer-sys">PLAYROOM OS v1.0 - Lapse</div>

<script type="module">
  import "./chain_lapse.js";
</script>
</body>
</html>
